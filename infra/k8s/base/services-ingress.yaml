apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: code-relay
spec:
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: collab
  namespace: code-relay
spec:
  selector: { app: collab }
  ports:
    - port: 80
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: code-relay
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coderelay
  namespace: code-relay
spec:
  rules:
    - host: coderelay.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
