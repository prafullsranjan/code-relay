apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-deny-egress
  namespace: code-relay-runners
spec:
  podSelector:
    matchLabels:
      app: code-relay-runner
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runner-quota
  namespace: code-relay-runners
spec:
  hard:
    pods: '50'
    requests.cpu: '10'
    requests.memory: 20Gi
    limits.cpu: '20'
    limits.memory: 40Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-limits
  namespace: code-relay-runners
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 250m
        memory: 128Mi
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc
handler: kata-fc
